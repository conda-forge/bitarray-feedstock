schema_version: 1

context:
  name: bitarray
  version: "3.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/53/71/dd598d2d546d11d7aca6cd25f05875e2dad194df0a663f1892690d4fb90d/bitarray-${{ version }}.tar.gz
  sha256: 37342f81c8f8e10ee5d1e23d5eda2e8dbd9d8d3a9d90e8285181fad57f21cdc1

build:
  # https://github.com/ilanschnell/bitarray/issues/99
  number: 0
  skip: python_impl == "pypy"
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - bitarray
      pip_check: false

about:
  license: PSF-2.0
  license_file: LICENSE
  summary: efficient arrays of booleans -- C extension
  description: |
    Bitarray provides an object type which efficiently represents an array of
    booleans. Bitarrays are sequence types that behave very similarly
    to usual lists. All functionality is implemented in C.
  homepage: https://github.com/ilanschnell/bitarray
  repository: https://github.com/ilanschnell/bitarray
  documentation: https://pypi.python.org/pypi/bitarray/0.8.1

extra:
  recipe-maintainers:
    - nehaljwani
    - mgorny
